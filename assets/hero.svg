    <path d="M0 100H220" stroke="#353331"/>
    <text x="0" y="134" fill="#918D87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">FORMAÇÃO</text>
    <text x="0" y="171" fill="#EDE7DC" font-family="Arial, Helvetica, sans-serif" font-size="18">Desenvolvimento</text>
