<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Hiago Sousa Lima — Desenvolvedor Full Stack em formação</title>
  <desc id="desc">Banner editorial em grafite, marfim e vermelho com o nome de Hiago e a frase Código para resolver, design para fazer sentido.</desc>
  <rect width="1200" height="400" rx="18" fill="#151515"/>
