  <path d="M880 0V400" stroke="#353331"/>
  <rect x="42" y="38" width="34" height="5" fill="#F02027"/>
  <text x="90" y="47" fill="#EDE7DC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">PORTFÓLIO / 2026</text>
